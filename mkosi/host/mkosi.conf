# The system image: Debian 13, our packages, the partitions and subvolumes of
# docs/design.md §3. Built by scripts/build-image.sh.
# Format: mkosi.conf(5).

[Distribution]
Distribution=debian
# Debian 13. mkosi needs the codename; it also writes the apt sources with it,
# so the box stays on Debian 13 until we move it (design §6.1).
Release=trixie
Architecture=x86-64

[Output]
Format=disk
ImageId=zoomriya
Output=zoomriya-os
OutputDirectory=../../build/image

[Build]
CacheDirectory=../../build/cache
# Our .deb files, installed by mkosi.postinst.chroot.
BuildSources=../../build/packages:packages

[Content]
Bootable=yes
Bootloader=systemd-boot
UnifiedKernelImages=no
# Same as /etc/kernel/cmdline, which kernels installed later by apt use.
# panic=10: a kernel that can't start restarts, using up one of its tries.
KernelCommandLine=root=PARTLABEL=system rootflags=subvol=@ rw panic=10
# Until the first setup asks for the box's language (locales, the agent's
# language-set): Debian builds only the one chosen.
Locale=C.UTF-8
Timezone=UTC
Packages=
        adwaita-icon-theme
        aide
        apparmor
        apt
        auditd
        avahi-daemon
        btrfs-progs
        ca-certificates
        console-setup
        dbus
        dbus-user-session
        fonts-inter
        fonts-noto-cjk
        fonts-noto-core
        gir1.2-gtk-4.0
        # Box Desktop's app windows (appview.py): WebKitGTK, and libsoup for the admin's session.
        gir1.2-soup-3.0
        gir1.2-webkit-6.0
        initramfs-tools
        iproute2
        iputils-ping
        kmod
        less
        libpam-systemd
        librsvg2-common
        linux-image-amd64
        # Countries' and provinces' names in every language (the first setup, Box Desktop).
        iso-codes
        locales
        login
        nftables
        # sshd and sudo, for advanced access, only while an admin has it on (zoomriya-agent).
        openssh-server
        openssh-sftp-server
        sudo
        passwd
        pipewire
        pipewire-bin
        postgresql
        postgresql-client
        python3
        python3-gi
        python3-gi-cairo
        smartmontools
        snapper
        sway
        systemd
        systemd-boot
        systemd-boot-efi
        systemd-resolved
        systemd-sysv
        systemd-timesyncd
        udev
        unattended-upgrades
        util-linux
        valkey-server
        wireplumber
        zstd
