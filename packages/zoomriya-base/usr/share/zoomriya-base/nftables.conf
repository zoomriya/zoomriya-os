#!/usr/sbin/nft -f
# The box's firewall (design §8): inbound denied except what's listed.
# SSH (advanced access, support mode) and the first-boot setup page are added
# by the agent while they're on; ZOOMRIYA Connect's short-block set joins this
# table. Format: nft(8).

flush ruleset

table inet zoomriya {
    chain input {
        type filter hook input priority filter; policy drop;

        iif lo accept
        ct state established,related accept
        ct state invalid drop

        # Path MTU, neighbour discovery and ping.
        ip protocol icmp icmp type { echo-request, destination-unreachable, time-exceeded } accept
        ip6 nexthdr icmpv6 icmpv6 type {
            echo-request, destination-unreachable, packet-too-big, time-exceeded,
            parameter-problem, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert
        } accept

        # DHCP replies.
        udp sport 67 udp dport 68 accept
        ip6 saddr fe80::/10 udp sport 547 udp dport 546 accept

        # mDNS, for first boot and the phone app finding the box.
        udp dport 5353 accept

        # The box's https name (connectd).
        tcp dport 443 accept
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
