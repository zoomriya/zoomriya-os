# The log folders Debian's packages make when they're installed, made again
# at every start (design §3): @log is new and empty after Erase everything,
# and auditd, PostgreSQL and the updates won't start or log without theirs.
# The journal's and systemd's own are systemd's; Valkey's is in
# zoomriya-valkey.conf.
# Format: tmpfiles.d(5).
d /var/log/apt                  0755 root root     -
d /var/log/audit                0750 root adm      -
d /var/log/postgresql           1775 root postgres -
d /var/log/unattended-upgrades  0750 root root     -
