# On ZOOMRIYA OS: only once it's set up, and with the box's Valkey. Required,
# not a condition: a request on its socket (zoomriya-id.socket) before the
# first setup has finished then waits for the setup, instead of being dropped.
[Unit]
Requires=zoomriya-id-setup.service
Wants=valkey-server.service
After=zoomriya-id-setup.service
