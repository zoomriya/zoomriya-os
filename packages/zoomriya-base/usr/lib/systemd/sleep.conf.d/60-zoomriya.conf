# The box is always on (design §8): it never sleeps, hibernates or saves power
# by switching itself off; only an admin's Shut down or its power button stop
# it. zoomriya-base also masks the sleep targets, so nothing can start them.
# Format: systemd-sleep.conf(5).
[Sleep]
AllowSuspend=no
AllowHibernation=no
AllowSuspendThenHibernate=no
AllowHybridSleep=no
