# The USB installer: a small Debian 13 that starts the installer on the screen
# (zoomriya-installer), carrying the system image built by
# scripts/build-image.sh. Built by scripts/build-installer.sh (design §10).
# Format: mkosi.conf(5).

[Distribution]
Distribution=debian
# Debian 13; mkosi needs the codename (as mkosi/host/mkosi.conf).
Release=trixie
Architecture=x86-64

[Output]
Format=disk
ImageId=zoomriya-installer
Output=zoomriya-installer
OutputDirectory=../../build/installer

[Build]
CacheDirectory=../../build/cache
BuildSources=../../build/packages:packages

[Content]
Bootable=yes
Bootloader=systemd-boot
UnifiedKernelImages=no
# The stick's own partition is read-only (EROFS); everything written while
# the installer runs goes to memory and is gone at restart.
KernelCommandLine=root=PARTLABEL=zoomriya-installer ro systemd.volatile=overlay quiet
Locale=C.UTF-8
Timezone=UTC
ExtraTrees=../../build/image/zoomriya-os.raw:/usr/share/zoomriya-installer/zoomriya-os.raw
Packages=
        adwaita-icon-theme
        btrfs-progs
        dbus
        efibootmgr
        fonts-inter
        gir1.2-gtk-4.0
        kmod
        libpam-systemd
        # GTK draws the more detailed symbolic icons with it.
        librsvg2-common
        linux-image-amd64
        login
        python3
        python3-gi
        python3-gi-cairo
        sway
        systemd
        systemd-boot
        systemd-boot-efi
        systemd-repart
        # Only to see whether the internet is there; installing doesn't need it.
        systemd-resolved
        systemd-sysv
        udev
        util-linux
