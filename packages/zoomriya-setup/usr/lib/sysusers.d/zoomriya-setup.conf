# /usr/lib/sysusers.d/zoomriya-setup.conf: the first setup's own account. It
# asks the agent (zoomriya-box) and draws on the box's screen (video, render,
# input); it can't sign in.
u zoomriya-setup - "ZOOMRIYA Box first setup" /var/lib/zoomriya-setup /usr/sbin/nologin
m zoomriya-setup zoomriya-box
m zoomriya-setup video
m zoomriya-setup render
m zoomriya-setup input
