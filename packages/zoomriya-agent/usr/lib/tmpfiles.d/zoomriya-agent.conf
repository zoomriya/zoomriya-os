# The agent's files. Format: tmpfiles.d(5).
# Advanced access's keys, written by the agent only, outside the OS's restore
# points (design §7.1).
d /data/zoomriya-os/ssh 0755 root root -
# admin's home over SSH.
d /home/admin 0700 admin admin -
# Diagnostics bundles, root's until an admin saves one to a USB stick
# (design §7.2).
d /var/lib/zoomriya-agent/diagnostics 0700 root root -
# App Center (design §6.9): each app's releases' units, and the family's data
# an app keeps, under /data so restoring the OS doesn't touch it.
d /var/lib/zoomriya-agent/apps 0700 root root -
d /data/apps 0755 root root -
