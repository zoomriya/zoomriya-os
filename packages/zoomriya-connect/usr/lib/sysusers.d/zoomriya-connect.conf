# /usr/lib/sysusers.d/zoomriya-connect.conf: ZOOMRIYA Connect's own account
# (connectd). It owns /data/zoomriya-connect (the box key, the devices) and
# its Box Desktop socket; it can't read the box's certificates, anyone's data
# or the apps' files. Box Desktop reaches it through the socket's group.
u zoomriya-connect - "ZOOMRIYA Connect" /data/zoomriya-connect /usr/sbin/nologin
g zoomriya-connect-api -
m box-desktop zoomriya-connect-api
