# The box is always on (design §8): sleep keys, a closed lid and idleness do
# nothing. The power button still shuts it down, as Box Desktop tells people.
# Format: logind.conf(5).
[Login]
HandleSuspendKey=ignore
HandleHibernateKey=ignore
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
IdleAction=ignore
