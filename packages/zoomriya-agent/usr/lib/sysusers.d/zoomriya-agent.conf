# Who may ask the agent: Box Desktop's server joins this group.
# Format: sysusers.d(5).
g zoomriya-box -


# Advanced access (design §7.1): the admins' account over SSH, by key only,
# with sudo. No password. Format: sysusers.d(5).
u admin - "Box admin (advanced access)" /home/admin /bin/bash
m admin zoomriya-box

# May read the box's certificates and their keys (/etc/zoomriya/tls/certs): the
# gateway joins it. Only root reads the certificate authority's key.
g zoomriya-tls -
