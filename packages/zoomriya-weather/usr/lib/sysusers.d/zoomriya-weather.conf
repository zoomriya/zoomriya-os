# /usr/lib/sysusers.d/zoomriya-weather.conf: the box's weather service's own
# account (weather.md §4). The one its declared connection names, so the
# firewall lets it out only while weather is allowed (design §8.2). It reads
# the town and the internet switches and writes its own file; no one's data,
# no app's files, sockets or groups.
u zoomriya-weather - "ZOOMRIYA weather" /var/lib/zoomriya-weather /usr/sbin/nologin
