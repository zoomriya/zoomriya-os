# Valkey's folders, set at every start (design §3): @valkey is empty on a new
# box and after Erase everything, and the image is built without root, so it
# can't give Valkey its settings and log folder (Debian's package would). The
# settings folder stays root's, writable by the group: a file Valkey owns
# under a folder it owns can't be checked safely.
# Format: tmpfiles.d(5).
z /etc/valkey               2770 root   valkey -
z /etc/valkey/valkey.conf   0640 valkey valkey -
d /var/lib/valkey           0750 valkey valkey -
d /var/log/valkey           2750 valkey adm    -
