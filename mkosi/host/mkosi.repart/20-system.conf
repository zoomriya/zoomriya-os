# system: Btrfs with the subvolumes of design §3. The OS goes in @, which the
# initrd mounts as / (rootflags=subvol=@ on the kernel command line).
# Everything an app or a family writes has its own subvolume, mounted by
# /etc/fstab, so an OS snapshot holds only the OS.
[Partition]
Type=root
Label=system
Format=btrfs
CopyFiles=/:/@
CopyFiles=/var/log:/@log
ExcludeFilesTarget=/@/var/log/
Subvolumes=/@ /@machines /@postgres /@valkey /@data /@log /@snapshots
MakeDirectories=/@machines /@postgres /@valkey /@data /@log /@snapshots
MakeDirectories=/@/var/lib/machines /@/var/lib/postgresql /@/var/lib/valkey /@/data /@/.snapshots
SizeMinBytes=8G
