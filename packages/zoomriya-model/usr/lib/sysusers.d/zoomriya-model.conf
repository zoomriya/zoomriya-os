# /usr/lib/sysusers.d/zoomriya-model.conf: the box's model service's own
# account. It reads the model files and keeps the admin's choice; no one's
# data, no keys, no sign-in.
u zoomriya-model - "ZOOMRIYA model service" /var/lib/zoomriya-model /usr/sbin/nologin
# Myira's model's download (box-desktop.md BD-17): its own account, the one
# the model's declared connection names, so the firewall lets it out only
# while that connection is allowed (design §8.2).
u zoomriya-model-fetch - "ZOOMRIYA model download" - /usr/sbin/nologin
