# /usr/lib/sysusers.d/box-desktop-app.conf: Box Desktop's account on the box's
# screen. It asks the agent (zoomriya-box), draws on the screen and reads the
# keyboard and mouse (video, render, input) and plays and records sound
# (audio); it can't sign in to the system.
u box-desktop-app - "Box Desktop" /var/lib/box-desktop-app /usr/sbin/nologin
m box-desktop-app zoomriya-box
m box-desktop-app video
m box-desktop-app render
m box-desktop-app input
m box-desktop-app audio
