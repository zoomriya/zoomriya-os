# The box key and the devices, in /data: kept by restore points and Reset
# the system, never put in backups (design §4).
d /data/zoomriya-connect 0700 zoomriya-connect zoomriya-connect -
# The web servers' sockets for paired laptops (Box Desktop's, the apps'
# gateway's): group zoomriya-link only, and new sockets take that group
# (setgid).
d /run/zoomriya-link 2770 root zoomriya-link -
