# /usr/lib/sysusers.d/zoomriya-connect.conf: connectd's own account. It owns
# /data/zoomriya-connect (the box key, the devices) and its Box Desktop
# socket; it can't read the box's certificates, anyone's data or the apps'
# files. Box Desktop reaches it through the socket's group. Group
# zoomriya-link: the web servers' sockets for paired laptops, in
# /run/zoomriya-link, which only connectd and those servers may open.
u zoomriya-connect - "Remote access (connectd)" /data/zoomriya-connect /usr/sbin/nologin
g zoomriya-connect-api -
m box-desktop zoomriya-connect-api
g zoomriya-link -
m zoomriya-connect zoomriya-link
