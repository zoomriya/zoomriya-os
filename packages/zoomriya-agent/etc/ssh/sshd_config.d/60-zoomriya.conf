# SSH on the box: advanced access (design §7.1). sshd runs only while an
# admin has turned advanced access on, and the firewall lets it in from the
# home network only (the agent fills zoomriya-base's remote_access chain).
# Key-only, as admin, with the keys the agent keeps under /data. Read before
# Debian's own settings, so these win. Format: sshd_config(5).
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
PermitRootLogin no
AuthenticationMethods publickey
AllowUsers admin
AuthorizedKeysFile /data/zoomriya-os/ssh/authorized_keys
# Each box makes its own, the first time (the image ships none).
HostKey /etc/ssh/ssh_host_ed25519_key

X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
AllowStreamLocalForwarding no
GatewayPorts no
PermitTunnel no
PermitUserEnvironment no

MaxAuthTries 3
LoginGraceTime 30
ClientAliveInterval 300
ClientAliveCountMax 2
