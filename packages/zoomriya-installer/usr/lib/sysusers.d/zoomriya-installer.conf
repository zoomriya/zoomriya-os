# /usr/lib/sysusers.d/zoomriya-installer.conf: the installer's screen
# (zoomriya-installer-screen.service): it draws on the screen and reads the
# keyboard and mouse (video, render, input); it can't sign in, and it can't
# write a drive: the installer's server does that, as root.
u zoomriya-installer - "ZOOMRIYA OS installer's screen" /run/zoomriya-installer /usr/sbin/nologin
m zoomriya-installer video
m zoomriya-installer render
m zoomriya-installer input
