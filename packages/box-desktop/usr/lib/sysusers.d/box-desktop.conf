# /usr/lib/sysusers.d/box-desktop.conf: Box Desktop's account, for its server
# (box-desktop.service) and the box's screen (box-desktop-screen.service). It
# asks the agent (zoomriya-box), reads the box's certificates (zoomriya-tls),
# draws on the screen and reads the keyboard and mouse (video, render, input)
# and plays and records sound (audio); it can't sign in to the system.
u box-desktop - "Box Desktop" /var/lib/box-desktop /usr/sbin/nologin
m box-desktop zoomriya-box
m box-desktop zoomriya-tls
m box-desktop video
m box-desktop render
m box-desktop input
m box-desktop audio
