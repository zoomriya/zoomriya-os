# What AIDE checks (design §8): the OS's files in /usr and /etc, against a
# baseline made at the first start and refreshed after every apt run
# (zoomriya-aide-*). The database is on @, so it rolls back with the OS.
# Format: aide.conf(5).
database_in=file:/var/lib/zoomriya-aide/aide.db.gz
database_out=file:/var/lib/zoomriya-aide/aide.db.new.gz
database_new=file:/var/lib/zoomriya-aide/aide.db.new.gz
gzip_dbout=yes
report_url=stdout
report_summarize_changes=yes

# Permissions, inode, links, owner, group, size, modification time and the
# content's SHA-256.
OS = p+i+n+u+g+s+m+sha256

# Folders without their size and times: a file made and removed in one (a
# program's temporary file), or one of the entries skipped below, changes
# them, and every file added, removed or changed is checked on its own.
DIR = p+i+n+u+g
/usr f,l,b,c,p,s OS
/usr d DIR
/etc f,l,b,c,p,s OS
/etc d DIR

# Written while the box runs, by design.
!/etc/adjtime$
!/etc/mtab$
!/etc/ld\.so\.cache$
!/etc/machine-id$
!/etc/resolv\.conf$
!/etc/systemd/system/zoomriya-maintenance\.timer\.d(/|$)
!/etc/systemd/system/timers\.target\.wants(/|$)
