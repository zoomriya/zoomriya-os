# The box's own screen (screen-session): one app, full screen, and nothing
# else. This file replaces sway's default configuration, so sway has no keys,
# bars or menus of its own; the app changes the keyboard's layout and the
# mouse's handedness with swaymsg (box-desktopd's screen.go).
default_border none
default_floating_border none
hide_edge_borders both
focus_follows_mouse no
mouse_warping none
xwayland disable
for_window [app_id=".*"] fullscreen enable
# The keyboard as the box's (XKB_DEFAULT_* from /etc/default/keyboard), the
# mouse right-handed until an admin's own is applied.
input type:pointer left_handed disabled
# The screen ends when its app does; systemd starts it again.
exec sh -c '$ZOOMRIYA_SCREEN_APP; swaymsg exit'
